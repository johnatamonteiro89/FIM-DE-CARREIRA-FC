<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101010"><link rel="manifest" href="manifest.webmanifest">
<title>FDC Gestão</title>
<style>
:root{--bg:#101010;--card:#232323;--line:#464646;--yellow:#f2d21a;--gold:#c9a227;--muted:#ababab;--white:#fff;--green:#78dc91;--red:#dc6969}
*{box-sizing:border-box}body{margin:0;background:#050505;color:var(--white);font-family:Arial,Helvetica,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:430px;min-height:100vh;margin:auto;background:var(--bg);position:relative;overflow:hidden}.screen{min-height:100vh;padding:18px 16px 94px}.hidden{display:none!important}.topline{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:5px;background:linear-gradient(90deg,var(--yellow) 0 65%,var(--gold) 65%);z-index:5}.brand{display:flex;align-items:center;gap:12px;padding-top:14px}.brand img{width:58px;height:52px;object-fit:contain;border-radius:50%}.brand strong{font-size:21px;display:block}.brand small{color:var(--muted)}h1{font-size:31px;margin:34px 0 22px}h2{font-size:20px;color:var(--yellow);margin:28px 0 12px;text-transform:uppercase;letter-spacing:.04em}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}.hero{min-height:190px;position:relative;overflow:hidden;background:#1d1d1d}.hero h1{margin:0;font-size:34px;position:relative;z-index:1}.hero p{color:#c8c8c8;font-size:18px;line-height:1.35;position:relative;z-index:1;max-width:58%}.hero img{position:absolute;right:-5px;bottom:-20px;width:190px;height:240px;object-fit:contain}.label{font-size:12px;font-weight:700;color:var(--yellow);letter-spacing:.08em}.big{font-size:34px;font-weight:700;margin-top:8px}.muted{color:var(--muted)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pill{display:inline-flex;padding:7px 11px;border-radius:14px;background:#3b5f42;color:var(--green);font-size:12px;font-weight:700}.pill.warn{background:#4c4320;color:var(--yellow)}.btn{background:var(--yellow);color:#111;border-radius:12px;padding:13px 15px;font-weight:700}.btn.dark{background:#373737;color:#fff}.btn.red{background:#4b2929;color:var(--red)}.btn.full{width:100%;margin-top:12px}.actions{display:flex;gap:10px;flex-wrap:wrap}.listitem{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid #3a3a3a}.listitem:last-child{border-bottom:0}.listitem strong{display:block}.listitem small{display:block;color:var(--muted);margin-top:5px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:78px;background:#181818;border-top:1px solid #333;display:flex;z-index:10}.nav button{flex:1;background:transparent;color:#999;font-size:11px}.nav button b{display:block;font-size:24px;line-height:30px;font-weight:400}.nav button.active{color:var(--yellow)}.login{padding:35px 28px;display:flex;flex-direction:column;align-items:stretch;min-height:100vh}.login .logo{width:170px;height:150px;object-fit:contain;align-self:center;margin:30px 0 5px}.login h1{text-align:center;margin:5px 0;font-size:34px}.login p{text-align:center;color:var(--muted);margin:8px 0 35px}.field{margin:10px 0}.field label{display:block;color:var(--yellow);font-size:12px;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;background:var(--card);color:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;outline:0}.demo{display:flex;gap:10px;margin-top:16px}.demo button{flex:1;background:#343434;color:#fff;padding:12px;border-radius:10px;font-size:12px}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:24px;z-index:20}.modal>div{background:#232323;border:1px solid #666;border-radius:22px;padding:24px;width:100%;max-width:380px}.modal h3{font-size:24px;margin:0 0 10px}.modal p{color:var(--muted);line-height:1.4}.modal .actions{justify-content:flex-end;margin-top:20px}.top-actions{display:flex;justify-content:space-between;align-items:center;margin-top:20px}.iconbtn{background:#343434;color:var(--yellow);width:42px;height:42px;border-radius:50%;font-size:22px}.empty{color:var(--muted);text-align:center;padding:35px 10px}.notice{background:#2e2e20;border-left:4px solid var(--yellow);padding:13px;border-radius:10px;color:#eee;margin:12px 0}
</style></head>
<body><div id="app" class="app"><div class="topline"></div></div>
<script>
const A='assets/';let role=null,screen='home';
const app=document.querySelector('#app');
function brand(sub='Área do time'){return `<div class="brand"><img src="${A}logo.jpg"><div><strong>FDC GESTÃO</strong><small>${sub}</small></div></div>`}
function login(){app.innerHTML=`<div class="login"><img class="logo" src="${A}logo.jpg"><h1>FDC GESTÃO</h1><p>Fim de Carreira F.C.</p><div class="field"><label>E-MAIL OU TELEFONE</label><input placeholder="Digite seu e-mail ou telefone"></div><div class="field"><label>SENHA</label><input type="password" placeholder="Digite sua senha"></div><button class="btn full" onclick="enter('admin')">ENTRAR</button><div class="demo"><button onclick="enter('admin')">Demo administrador</button><button onclick="enter('athlete')">Demo atleta</button></div><p style="font-size:12px;margin-top:25px">Primeiro acesso? Fale com um administrador.</p></div>`}
function enter(r){role=r;screen='home';render()}
function nav(){let items=role==='admin'?[['home','⌂','Início'],['games','⚽','Jogos'],['events','＋','Eventos'],['cash','◉','Caixa'],['athletes','♙','Atletas']]:[['home','⌂','Início'],['games','⚽','Jogos'],['events','＋','Eventos'],['profile','♙','Meu perfil']];return `<div class="nav">${items.map(x=>`<button class="${screen===x[0]?'active':''}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('')}</div>`}
function shell(title,sub='Área do time',body=''){return `<div class="screen">${brand(sub)}<div class="top-actions"><h1>${title}</h1>${role==='admin'?'<button class="iconbtn" onclick="go(\'settings\')">⚙</button>':''}</div>${body}</div>${nav()}`}
function home(){if(role==='athlete')return shell('Olá, João!','Área do atleta',`<div class="card hero"><h1>Fala, FDC!</h1><p>Organização do time na palma da mão.</p><img src="${A}mascote.png"></div><h2>Seu próximo jogo</h2><div class="card"><div class="label">DOMINGO, 28 SETEMBRO • 10:00</div><h3>Arena do Bairro</h3><p class="muted">Você foi relacionado a esta partida.</p></div><h2>Comunicados</h2><div class="card"><strong>Novo uniforme do FDC</strong><p class="muted">Confira o comunicado dos administradores.</p></div>`);return shell('Início','Área administrativa',`<div class="card hero"><h1>Fala, FDC!</h1><p>Tudo do time organizado em um só lugar.</p><img src="${A}mascote.png"></div><h2>Próximo jogo</h2><div class="card"><div class="row"><div><div class="label">DOMINGO, 28 SET • 10:00</div><h3>Arena do Bairro</h3><p class="muted">12 de 14 atletas relacionados</p></div><span class="pill">R$ 15</span></div></div><div class="grid2"><div class="card"><div class="label">SALDO</div><div class="big">R$ 1.240</div></div><div class="card"><div class="label">EVENTOS</div><div class="big">2 ativos</div></div></div><div class="actions"><button class="btn" onclick="go('newgame')">＋ Novo jogo</button><button class="btn dark" onclick="go('newevent')">＋ Novo evento</button></div>`)}
function games(){return shell('Jogos','Agenda e controle das partidas',`<div class="actions"><button class="btn" onclick="go('newgame')">＋ Novo jogo</button></div><h2>Próximos jogos</h2><div class="card"><div class="label">DOMINGO, 28 SET • 10:00</div><h3>Arena do Bairro</h3><p class="muted">12 de 14 atletas relacionados</p><button class="btn dark" onclick="go('gamedetail')">Ver detalhes</button></div><div class="card"><div class="label">QUARTA, 01 OUT • 20:00</div><h3>Campo Municipal</h3><p class="muted">9 de 14 atletas relacionados</p></div>`)}
function events(){return shell('Eventos','Projetos e atividades do time',`<div class="actions"><button class="btn" onclick="go('newevent')">＋ Novo evento</button></div><h2>Ativos</h2><div class="card"><div class="row"><div><h3>Uniforme 2026</h3><p class="muted">14 participantes • R$ 120 por atleta</p></div><span class="pill">Ativo</span></div><button class="btn dark" onclick="go('eventedit')">Editar evento</button></div><div class="card"><div class="row"><div><h3>Festa de fim de ano</h3><p class="muted">20 participantes</p></div><span class="pill warn">Aberto</span></div></div><h2>Arquivados</h2><div class="card"><div class="row"><div><strong>Uniforme 2025</strong><small>Arquivado em 15/12/2025</small></div><button class="btn dark" onclick="confirmBox('Restaurar evento?','Os dados serão preservados e o evento voltará para a lista de ativos.','Restaurar')">↻</button></div></div>`)}
function cash(){return shell('Caixa','Visão geral do dinheiro do time',`<div class="card"><div class="label">SALDO DISPONÍVEL</div><div class="big">R$ 1.240,00</div><p class="muted">Atualizado hoje</p></div><div class="grid2"><div class="card"><div class="label">ENTRADAS</div><div class="big" style="font-size:25px;color:var(--green)">R$ 2.180</div></div><div class="card"><div class="label">DESPESAS</div><div class="big" style="font-size:25px;color:var(--red)">R$ 940</div></div></div><div class="actions"><button class="btn" onclick="go('expense')">＋ Lançar despesa</button><button class="btn dark" onclick="go('reports')">Relatórios</button></div><h2>Movimentações recentes</h2><div class="card"><div class="listitem"><div><strong>Cota — Jogo 24/09</strong><small>Hoje</small></div><b style="color:var(--green)">+ R$ 210</b></div><div class="listitem"><div><strong>Aluguel do campo</strong><small>Hoje</small></div><b style="color:var(--red)">- R$ 150</b></div></div>`)}
function athletes(){return shell('Atletas','Elenco do FDC',`<div class="actions"><button class="btn" onclick="go('newathlete')">＋ Adicionar atleta</button><button class="btn dark" onclick="go('filters')">Buscar e filtrar</button></div><h2>14 atletas ativos</h2><div class="card">${['João Silva • #10 • Atacante','Carlos Souza • #07 • Meia','Pedro Alves • #09 • Goleiro','Rafael Lima • #05 • Zagueiro'].map(n=>`<div class="listitem" onclick="go('athleteedit')"><div><strong>${n.split(' • ')[0]}</strong><small>${n.split(' • ').slice(1).join(' • ')}</small></div><span>›</span></div>`).join('')}</div>`)}
function profile(){return shell('Meu perfil','Área do atleta',`<div class="card"><h2 style="margin-top:0">João Silva</h2><p class="muted">Atacante • Camisa #10</p><span class="pill">Acesso ativo</span></div><h2>Seu próximo jogo</h2><div class="card"><strong>Domingo, 28/09 • Arena do Bairro</strong><p class="muted">Você foi relacionado.</p></div><h2>Comunicados</h2><div class="card"><strong>Novo uniforme do FDC</strong><p class="muted">Publicado hoje</p></div>`)}
function form(title,kind){return shell(title,'Acesso administrativo',`<div class="card"><div class="field"><label>NOME</label><input value="${kind==='event'?'Uniforme 2026':''}" placeholder="Digite o nome"></div><div class="field"><label>DATA</label><input value="28/09/2026" placeholder="Data"></div><div class="field"><label>VALOR DA COTA</label><input value="R$ 120,00" placeholder="Valor"></div><div class="field"><label>DESCRIÇÃO</label><textarea rows="3" placeholder="Observações"></textarea></div><button class="btn full" onclick="toast('Salvo com sucesso')">SALVAR</button></div>`)}
function detail(type){let event=type==='event';return shell(event?'Detalhes do evento':'Detalhes do jogo','Acesso administrativo',`<div class="card"><div class="label">${event?'UNIFORME 2026':'DOMINGO, 28 SETEMBRO'}</div><h3>${event?'14 participantes':'Arena do Bairro • 10:00'}</h3><p class="muted">${event?'Cota: R$ 120 por atleta':'12 de 14 atletas relacionados'}</p></div><div class="actions"><button class="btn" onclick="go('${event?'eventedit':'roster'}')">${event?'Editar evento':'Relacionar jogadores'}</button><button class="btn dark" onclick="go('close')">Fechar atividade</button></div><h2>${event?'Resumo financeiro':'Pagamentos administrativos'}</h2><div class="card"><div class="listitem"><span>Total recebido</span><b>R$ ${event?'960':'180'}</b></div><div class="listitem"><span>Pendentes</span><b style="color:var(--yellow)">${event?'6':'2'}</b></div></div>`)}
function settings(){return shell('Configurações','Acesso administrativo',`<div class="card"><h3>Identidade do time</h3><p class="muted">Fim de Carreira F.C. • FDC Gestão</p></div>${['Administradores','Notificações','Aparência','Backup e exportação','Segurança'].map((x,i)=>`<div class="card row" onclick="go('${['admins','notifications','backup','backup','security'][i]}')"><div><strong>${x}</strong><small>${i===0?'3 usuários com acesso completo':i===1?'Avisos e comunicados':'Configuração do aplicativo'}</small></div><span>›</span></div>`).join('')}<button class="btn red full" onclick="login()">Sair da conta</button>`)}
function simple(title,sub,content){return shell(title,sub,content)}
function page(){if(screen==='home')return home();if(screen==='games')return games();if(screen==='events')return events();if(screen==='cash')return cash();if(screen==='athletes')return athletes();if(screen==='profile')return profile();if(screen==='newgame')return form('Novo jogo','game');if(screen==='newevent')return form('Novo evento','event');if(screen==='eventedit')return form('Editar evento','event');if(screen==='gamedetail')return detail('game');if(screen==='eventdetail')return detail('event');if(screen==='settings')return settings();if(screen==='expense')return form('Lançar despesa','expense');if(screen==='reports')return simple('Relatórios','Acesso administrativo',`<div class="card"><div class="label">SETEMBRO DE 2026</div><div class="big">R$ 1.240,00</div><p class="muted">Saldo final do período</p></div><div class="card"><div class="listitem"><span>Entradas</span><b style="color:var(--green)">R$ 2.180</b></div><div class="listitem"><span>Despesas</span><b style="color:var(--red)">R$ 940</b></div></div><button class="btn full" onclick="toast('Relatório exportado')">Exportar relatório</button>`);if(screen==='roster')return simple('Relacionar jogadores','Acesso administrativo',`<div class="notice">Somente administradores podem relacionar jogadores por jogo.</div><div class="card">${['João Silva','#10','Carlos Souza','#07','Pedro Alves','#09','Rafael Lima','#05'].filter((_,i)=>i%2===0).map((n,i)=>`<div class="listitem"><span>${n}</span><button class="btn dark" onclick="toast('Jogador relacionado')">Selecionar</button></div>`).join('')}</div><button class="btn full" onclick="toast('Relação salva')">Salvar relação</button>`);if(screen==='newathlete')return form('Adicionar atleta','athlete');if(screen==='athleteedit')return form('Editar atleta','athlete');if(screen==='admins')return simple('Administradores','Acesso administrativo',`<div class="notice">3 administradores com acesso completo ao time.</div><div class="card">${['Marcos Silva','Rafael Lima','Carlos Souza'].map((x,i)=>`<div class="listitem"><span><strong>${x}</strong><small>${i===0?'Administrador principal':'Administrador'}</small></span><span class="pill">Ativo</span></div>`).join('')}</div>`);if(screen==='notifications')return simple('Notificações','Acesso administrativo',`<button class="btn full" onclick="toast('Comunicado criado')">＋ Novo comunicado</button><div class="card"><div class="listitem"><span><strong>Novo uniforme do FDC</strong><small>Todos os atletas • Hoje</small></span><span>›</span></div><div class="listitem"><span><strong>Jogo de domingo confirmado</strong><small>Relacionados • Ontem</small></span><span>›</span></div></div>`);if(screen==='backup')return simple('Backup e exportação','Acesso administrativo',`<div class="card"><div class="label">ÚLTIMO BACKUP</div><div class="big">Hoje, 17:04</div><p class="muted">Todos os dados estão protegidos.</p></div><button class="btn full" onclick="toast('Backup realizado')">Fazer backup agora</button><button class="btn dark full" onclick="toast('Exportação preparada')">Exportar relatório</button>`);if(screen==='security')return simple('Segurança','Acesso administrativo',`<div class="card"><div class="label">CONTA PROTEGIDA</div><div class="big">Tudo certo</div><p class="muted">1 sessão ativa neste aparelho.</p></div><button class="btn full" onclick="toast('Senha atualizada')">Alterar senha</button>`);if(screen==='close')return simple('Fechar atividade','Acesso administrativo',`<div class="card"><h3>Jogo • 28 de setembro</h3><p class="muted">Saldo final: R$ 30,00</p><div class="listitem"><span>Pagamentos confirmados</span><b>12</b></div><div class="listitem"><span>Despesas lançadas</span><b>1</b></div></div><button class="btn full" onclick="confirmBox('Fechar esta atividade?','Depois do fechamento, novas alterações ficarão bloqueadas.','Fechar')">Fechar e bloquear edições</button>`);return home()}
function go(s){screen=s;render()}function render(){if(!role)return login();app.innerHTML=page()}function toast(msg){const x=document.createElement('div');x.className='modal';x.innerHTML=`<div><h3>FDC Gestão</h3><p>${msg}</p><div class="actions"><button class="btn" onclick="this.closest('.modal').remove()">OK</button></div></div>`;app.appendChild(x)}function confirmBox(t,p,ok){const x=document.createElement('div');x.className='modal';x.innerHTML=`<div><h3>${t}</h3><p>${p}</p><div class="actions"><button class="btn dark" onclick="this.closest('.modal').remove()">Cancelar</button><button class="btn" onclick="this.closest('.modal').remove();toast('Ação confirmada')">${ok}</button></div></div>`;app.appendChild(x)}render(); if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js').catch(()=>{});}
</script></body></html>
